<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #0002;
        }

        h1 {
            color: #2563eb;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Minha primeira página!</h1>

        <p>
            Esta página foi criada utilizando
            HTML, CSS e JavaScript.
        </p>

        <button onclick="mostrarMensagem()">
            Clique aqui
        </button>
        <a href="texto.html">Acessar texto</a>

        <a href="atividade.html">Iniciar atividade</a>
        
        <p id="mensagem"></p>
    </div>

    <script>
        function mostrarMensagem() {
            document.getElementById("mensagem").innerText =
                "Olá! O JavaScript está funcionando!";
        }
    </script>

</body>
</html>
